<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Last Order — Multiplayer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">
</head>
<body>
  <main class="container">
    <header>
      <h1>Last Order</h1>
      <p class="muted">Best Drinking Game Ever — now multiplayer</p>
    </header>

    <section id="create-section" class="card">
      <h2>Create a game</h2>
      <label>
        Your name
        <input id="host-name" placeholder="e.g. Alex" maxlength="24">
      </label>
      <button id="create-game">Create Game</button>
      <div id="created-info" class="hidden">
        <p>Game code: <strong id="game-code"></strong></p>
        <img id="qr" alt="Join QR code">
        <p>Share this code or QR to let players join.</p>
      </div>
    </section>

    <section id="join-section" class="card">
      <h2>Join a game</h2>
      <label>
        Your name
        <input id="join-name" placeholder="e.g. Mia" maxlength="24">
      </label>
      <label>
        Game code
        <input id="join-code" placeholder="6-character code" maxlength="6">
      </label>
      <button id="join-game">Join Game</button>
      <div id="join-error" class="muted"></div>
    </section>

    <section id="lobby" class="card hidden">
      <h2>Lobby — <span id="lobby-code"></span></h2>
      <p>Players (<span id="player-count">0</span>):</p>
      <ul id="players-list"></ul>
      <div id="host-controls" class="hidden">
        <button id="start-game">Start Game</button>
      </div>
      <div id="status" class="muted"></div>
    </section>

    <footer class="muted small">Mobile-first PWA · Anonymous join via Supabase Realtime</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script type="module" src="js/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
